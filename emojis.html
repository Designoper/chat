<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<title>Emojis Personalizados</title>
	<!-- Cargamos la librería Twemoji desde un CDN -->
	<script src="https://unpkg.com" crossorigin="anonymous"></script>
	<style>
		/* Estilo para que los emojis se adapten perfectamente al tamaño del texto */
		img.emoji {
			height: 1em;
			width: 1em;
			margin: 0 .05em 0 .1em;
			vertical-align: -0.1em;
		}
	</style>
</head>

<body>

	<div id="chat">
		<p>¡Hola! Este es un mensaje con emojis 😂🚀🎉 que se verán igual en todos lados.</p>
	</div>

	<script>
		// Escaneamos el contenedor y reemplazamos los caracteres Unicode por imágenes SVG
		twemoji.parse(document.getElementById('chat'));
	</script>

</body>

</html>
